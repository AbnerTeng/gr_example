defaults:
  - train
  - _self_

paths:
  train_data: ${paths.root_dir}/data/gr/nq_rq9_layout_1x9_from3x3_s42/train.jsonl
  test_data: ${paths.root_dir}/data/gr/nq_rq9_layout_1x9_from3x3_s42/validation_expanded.jsonl
  idx_to_rqid: ${paths.root_dir}/data/gr/nq_rq9_layout_1x9_from3x3_s42/all_view_ids.json

rq:
  n_levels: 9
  n_codes: 256

multi_view:
  enabled: true
  n_views: 1

codebook_init: ${paths.root_dir}/data/rq_runs/nq_rq9_sliced_s42/rq_codebooks.npy
out_dir: ${paths.root_dir}/checkpoints/nq-t5-large-rq9-layout-1x9-formal-s42

data:
  max_in_len: 512
  max_out_len: 12

training:
  batch_size: 16
  grad_accum: 8
  epochs: 10
  lr: 3e-4
  lr_scheduler_type: cosine
  warmup: 0.10
  eval_steps: 667
  save_steps: 667
  eval_beams: 10
  weight_decay: 0.01
  max_grad_norm: 0.5
  eval_strategy: steps
  save_strategy: steps
  report_to: wandb
  logging_steps: 100
  save_total_limit: 3
  load_best_model_at_end: true

wandb:
  project: t5-gr-nq
  run_name: nq-rq9-layout-1x9-formal-s42
