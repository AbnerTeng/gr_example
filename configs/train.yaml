paths:
  root_dir: ${hydra:runtime.cwd}
  msmarco_train: ${paths.root_dir}/data/msmarco/train.jsonl
  msmarco_valid: ${paths.root_dir}/data/msmarco/valid.jsonl
  msmarco_test: ${paths.root_dir}/data/msmarco/test.jsonl
  doc_embeddings: ${paths.root_dir}/data/doc_embeddings.npy
  data_dir: ${paths.root_dir}/data
  pseudo_queries: ${paths.data_dir}/pseudo_queries.jsonl
  semid_to_rqid: ${paths.data_dir}/semid_to_rqid.json
  idx_to_rqid: ${paths.data_dir}/idx_to_rqid.json
  train_data: ${paths.data_dir}/train.jsonl
  test_data: ${paths.data_dir}/test.jsonl

emb:
  model_name: Qwen/Qwen3-Embedding-0.6B
  batch_size: 128

rq:
  n_levels: 4
  n_codes: 256

assign_rq_docids:
  n_iter: 20
  seed: 42

gen_pseudo_queries:
  model: doc2query/msmarco-t5-base-v1
  n_queries: 5
  batch_size: 64
  max_doc_len: 256
  max_query_len: 64
  device: cuda

prep_data:
  seed: 42

base_model: google-t5/t5-large
out_dir: ${paths.root_dir}/checkpoints/t5-large-gr

data:
  max_in_len: 512
  max_out_len: 128

training:
  batch_size: 8
  grad_accum: 8
  epochs: 10
  lr: 3e-4
  lr_scheduler_type: cosine
  warmup: 0.10
  eval_steps: 2000
  save_steps: 2000
  eval_beams: 10
  weight_decay: 0.01
  max_grad_norm: 0.5
  eval_strategy: steps
  save_strategy: steps
  report_to: wandb
  logging_steps: 100
  save_total_limit: 3

wandb:
  project: t5-gr-msmarco
  run_name: t5-large-rq-docttttquery
